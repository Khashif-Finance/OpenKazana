[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openkhazana-api"
version = "0.1.0"
description = "Backend API, Pakistan tax/ledger engine, and market-data scrapers for OpenKhazana."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "redis>=5.2.0",
    "arq>=0.26.1",
    "bcrypt>=4.2.0",
    "PyJWT>=2.9.0",
    "httpx>=0.27.2",
    "curl-cffi>=0.7.3",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.17",
    "yfinance>=0.2.50",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "scipy>=1.14.0",
    "ta>=0.11.0",
    "playwright>=1.50.0",
    "pdfplumber>=0.11.4",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.5.0",
    "PyPortfolioOpt>=1.5.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501", "B008"]
