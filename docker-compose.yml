services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openkhazana}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openkhazana_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-openkhazana}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openkhazana} -d ${POSTGRES_DB:-openkhazana}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-openkhazana}:${POSTGRES_PASSWORD:-openkhazana_dev_pw}@postgres:5432/${POSTGRES_DB:-openkhazana}
      REDIS_URL: redis://redis:6379/0
      AUTH_MODE: ${AUTH_MODE:-local}
      ALLOW_PUBLIC_REGISTRATION: ${ALLOW_PUBLIC_REGISTRATION:-true}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-openkhazana}:${POSTGRES_PASSWORD:-openkhazana_dev_pw}@postgres:5432/${POSTGRES_DB:-openkhazana}
      REDIS_URL: redis://redis:6379/0
      AUTH_MODE: ${AUTH_MODE:-local}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - scraper_dlq:/tmp/scraper_dlq
    command: arq app.workers.arq_worker.WorkerSettings

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        INTERNAL_API_BASE_URL: http://api:8000
    restart: unless-stopped
    environment:
      INTERNAL_API_BASE_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pg_data:
  redis_data:
  scraper_dlq:
